spring.application.name=catalog_service
server.port=${CATALOG_SERVICE_PORT:8082}

# Configuración de la Base de Datos (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/catalog_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Configuración de Analytics Service (OpenFeign)
analytics.service.url=http://localhost:${ANALYTICS_SERVICE_PORT:8084}
