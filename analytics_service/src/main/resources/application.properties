spring.application.name=analytics_service
server.port=8084

# Configuración de la Base de Datos (PostgreSQL - Read Model CQRS)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/analytics_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# Configuración de JPA / Hibernate (Sin generación DDL)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
