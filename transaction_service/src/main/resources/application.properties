spring.application.name=transaction_service
server.port=8083

# Configuración de la Base de Datos (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/transaction_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Configuración de Catalog Service (OpenFeign)
catalog.service.url=http://localhost:8082


