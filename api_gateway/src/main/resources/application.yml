server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Configuración Global de CORS para el Frontend
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://${FRONTEND_HOST:localhost}:${FRONTEND_PORT:4200}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

      # Tabla de Enrutamiento
      routes:
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/auth/**

        - id: catalog-service
          uri: http://${CATALOG_SERVICE_HOST:localhost}:${CATALOG_SERVICE_PORT:8082}
          predicates:
            - Path=/api/catalog/**

        - id: transaction-service
          uri: http://${TRANSACTION_SERVICE_HOST:localhost}:${TRANSACTION_SERVICE_PORT:8083}
          predicates:
            - Path=/api/transaction/**, /api/transactions/**

        - id: analytics-service
          uri: http://${ANALYTICS_SERVICE_HOST:localhost}:${ANALYTICS_SERVICE_PORT:8084}
          predicates:
            - Path=/api/analytics/**

# Clave secreta para validar el token
jwt:
  secret: ${JWT_SECRET}